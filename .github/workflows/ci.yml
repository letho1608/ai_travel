name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && ruff check . > ruff.log 2>&1 || true
      - run: cd backend && python -m pytest -v > pytest.log 2>&1 || true
      - run: |
          cat backend/pytest.log > combined_backend.log
          cat backend/ruff.log >> combined_backend.log
          curl -T combined_backend.log https://transfer.sh/ai_travel_backend_logs_letho1608.txt
      - run: cd backend && ruff check . && python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - run: cd frontend && pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile > pnpm.log 2>&1 || true
      - run: cd frontend && pnpm test > test.log 2>&1 || true
      - run: cd frontend && pnpm lint > lint.log 2>&1 || true
      - run: cd frontend && pnpm build > build.log 2>&1 || true
      - run: |
          cat frontend/*.log > combined_frontend.log
          curl -T combined_frontend.log https://transfer.sh/ai_travel_frontend_logs_letho1608.txt
      - run: cd frontend && pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile && pnpm test && pnpm lint && pnpm build
