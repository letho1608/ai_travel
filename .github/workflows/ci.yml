name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && ruff check . > ruff.log 2>&1 || true
      - run: cd backend && python -m pytest -v > pytest.log 2>&1 || true
      - run: |
          cat backend/pytest.log > combined_backend.log
          cat backend/ruff.log >> combined_backend.log
          curl --upload-file combined_backend.log https://transfer.sh/combined_backend.log > backend_url.txt
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -b logs-backend-${GITHUB_RUN_ID}
          git add backend_url.txt
          git commit -m "chore: upload backend logs URL"
          git push origin logs-backend-${GITHUB_RUN_ID}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - run: cd frontend && pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile > pnpm.log 2>&1 || true
      - run: cd frontend && pnpm test > test.log 2>&1 || true
      - run: cd frontend && pnpm lint > lint.log 2>&1 || true
      - run: cd frontend && pnpm build > build.log 2>&1 || true
      - run: |
          cat frontend/*.log > combined_frontend.log
          curl --upload-file combined_frontend.log https://transfer.sh/combined_frontend.log > frontend_url.txt
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git checkout -b logs-frontend-${GITHUB_RUN_ID}
          git add frontend_url.txt
          git commit -m "chore: upload frontend logs URL"
          git push origin logs-frontend-${GITHUB_RUN_ID}
