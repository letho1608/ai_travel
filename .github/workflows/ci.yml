name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && ruff check . > ruff.log 2>&1 || true
      - run: cd backend && python -m pytest -v > pytest.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: backend/*.log
      - run: cd backend && ruff check . && python -m pytest -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - run: cd frontend && pnpm config set ignore-scripts true && pnpm install > pnpm.log 2>&1 || true
      - run: cd frontend && pnpm lint > lint.log 2>&1 || true
      - run: cd frontend && pnpm build > build.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-logs
          path: frontend/*.log
      - run: cd frontend && pnpm config set ignore-scripts true && pnpm install && pnpm test && pnpm lint && pnpm build
