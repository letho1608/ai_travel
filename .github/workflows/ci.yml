name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r backend/requirements.txt
      - run: cd backend && ruff check . > ruff.log 2>&1 || true
      - run: cd backend && python -m pytest -v > pytest.log 2>&1 || true
      - run: |
          cat backend/pytest.log > combined_backend.log
          cat backend/ruff.log >> combined_backend.log
          URL=$(curl -s -X POST --data-binary @combined_backend.log https://paste.rs)
          curl -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments -d "{\"body\":\"Backend logs: $URL\"}"
      - run: cd backend && ruff check . && python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - run: cd frontend && pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile > pnpm.log 2>&1 || true
      - run: cd frontend && pnpm test > test.log 2>&1 || true
      - run: cd frontend && pnpm lint > lint.log 2>&1 || true
      - run: cd frontend && pnpm build > build.log 2>&1 || true
      - run: |
          cat frontend/*.log > combined_frontend.log
          URL=$(curl -s -X POST --data-binary @combined_frontend.log https://paste.rs)
          curl -L -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments -d "{\"body\":\"Frontend logs: $URL\"}"
      - run: cd frontend && pnpm config set ignore-scripts true && pnpm install --no-frozen-lockfile && pnpm test && pnpm lint && pnpm build
